name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # --- Pinned shellcheck -------------------------------------------------
    # Single source of truth for the ShellCheck used by CI. `apt-get install
    # shellcheck` on ubuntu-latest ships 0.9.0, which disagrees with developer
    # machines (0.11.0) and made SC2120 fail only in CI.
    #
    # To bump: change SHELLCHECK_VERSION *and* SHELLCHECK_SHA256 together, then
    # refresh the digest with:
    #   curl -fsSL -o /tmp/sc.tar.xz \
    #     https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz
    #   sha256sum /tmp/sc.tar.xz
    #
    # Caveat: upstream ShellCheck publishes NO official sha256 manifest for its
    # release assets, so SHELLCHECK_SHA256 is pinned from the official release
    # asset rather than from a vendor-signed file. Cross-check anchor: the
    # official image koalaman/shellcheck:v0.11.0 has Docker Hub manifest digest
    # sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned shellcheck cache
        id: cache-shellcheck
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/shellcheck-${{ env.SHELLCHECK_VERSION }}
          # Key includes both version and digest, so a bump can never be
          # masked by a stale cache entry.
          key: shellcheck-linux-x86_64-${{ env.SHELLCHECK_VERSION }}-${{ env.SHELLCHECK_SHA256 }}

      - name: Install pinned shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          archive="$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}.tar.xz"

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::pinned asset is linux.x86_64 but runner arch is $(uname -m)"
            exit 1
          fi

          if [ -x "$prefix/shellcheck" ]; then
            echo "Reusing cached shellcheck from $prefix"
          else
            echo "Downloading $url"
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$archive" "$url"
            echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check --strict
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            mkdir -p "$prefix"
            install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$prefix/shellcheck"
          fi

          echo "$prefix" >> "$GITHUB_PATH"
          # $GITHUB_PATH is only applied to LATER steps, so without this the
          # checks below would resolve `shellcheck` to the runner's apt 0.9.0 in
          # /usr/bin. The runner prepends $GITHUB_PATH entries to PATH in those
          # steps, so mirroring the same prepend here makes this step validate
          # the exact PATH resolution that subsequent steps get.
          export PATH="$prefix:$PATH"
          shellcheck --version
          # Guards against the runner's apt shellcheck (0.9.0) shadowing the pin.
          shellcheck --version | grep -q "version: $SHELLCHECK_VERSION" || {
            echo "::error::shellcheck on PATH is not the pinned $SHELLCHECK_VERSION"
            exit 1
          }

      - name: Install OpenCode CLI
        run: npm install -g @opencode/cli@2.1.4

      - name: Run test suite
        run: bash tests/run-all.sh

      - name: Shellcheck all shell files
        run: find . -name "*.sh" -not -path "./.git/*" | xargs shellcheck --severity=warning

      - name: Check generate-agents (dry-run)
        run: bash shared/scripts/generate-agents.sh --check

      - name: Plugin version sync check
        run: |
          plugin_version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          install_version=$(grep '^FORGE_VERSION=' install.sh | cut -d'"' -f2)
          echo "plugin.json: $plugin_version  install.sh: $install_version"
          test "$plugin_version" = "$install_version"

      - name: 8 KB guard for shared/CLAUDE-shared.md
        run: test $(wc -c < shared/CLAUDE-shared.md) -le 8192

  v2-safety:
    runs-on: ubuntu-22.04
    # Maximum contained run: 3240s scenario + 60s close grace = 55 minutes.
    # The 75-minute job leaves 20 minutes for checkout/preparation, receipt
    # finalization, classification, and the always-run artifact upload.
    timeout-minutes: 75
    # Runtime requirements (provided by the ubuntu-22.04 runner, not installed
    # by this job): /usr/bin/python3, util-linux unshare, GNU timeout/env and
    # procfs; the runner kernel must permit rootless user/PID namespaces,
    # private --mount-proc, pidfd_open/pidfd_send_signal, and the nested user
    # namespace preflight. Absence of any capability is a fail-closed CI error.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run V2 safety scenarios inside accredited containment
        id: v2-safety
        run: |
          set -euo pipefail
          job_artifacts="$RUNNER_TEMP/v2-safety-job-artifacts"
          mkdir -m 700 "$job_artifacts"
          caller_home="$RUNNER_TEMP/v2-safety-caller-home"
          caller_xdg_config="$RUNNER_TEMP/v2-safety-caller-xdg-config"
          caller_xdg_data="$RUNNER_TEMP/v2-safety-caller-xdg-data"
          caller_xdg_cache="$RUNNER_TEMP/v2-safety-caller-xdg-cache"
          caller_xdg_state="$RUNNER_TEMP/v2-safety-caller-xdg-state"
          caller_tmp="$RUNNER_TEMP/v2-safety-caller-tmp"
          mkdir -m 700 "$caller_home" "$caller_xdg_config" "$caller_xdg_data" \
            "$caller_xdg_cache" "$caller_xdg_state" "$caller_tmp"
          receipt_pointer="$job_artifacts/receipt-path.txt"

          set +e
          env HOME="$caller_home" \
            XDG_CONFIG_HOME="$caller_xdg_config" \
            XDG_DATA_HOME="$caller_xdg_data" \
            XDG_CACHE_HOME="$caller_xdg_cache" \
            XDG_STATE_HOME="$caller_xdg_state" \
            TMPDIR="$caller_tmp" \
            bash tools/verification/forge-contained-run.sh \
              --receipt-dir /tmp/opencode/forge-contracts-v2/remediacion-contencion/runs \
              --receipt-out "$receipt_pointer" \
              --scenario-timeout 3240 \
              --close-timeout 60 \
              -- bash tools/ci/v2-safety.sh --all --artifacts-dir "$job_artifacts/bank"
          entry_rc=$?
          set -e
          printf '%s\n' "$entry_rc" >"$job_artifacts/entrypoint.rc"
          printf 'entrypoint_rc=%s\n' "$entry_rc" >>"$GITHUB_OUTPUT"

          if [[ ! -s "$receipt_pointer" ]]; then
            echo "::error::La entrada de contencion no publico la ruta del recibo."
            exit 1
          fi
          receipt="$(<"$receipt_pointer")"
          if [[ ! "$receipt" =~ ^/tmp/opencode/forge-contracts-v2/remediacion-contencion/runs/run-[^/]+/receipt\.txt$ ]] \
            || [[ ! -f "$receipt" || -L "$receipt" ]]; then
            echo "::error::La ruta publicada del recibo no pertenece a una invocacion valida."
            exit 1
          fi
          receipt_dir="${receipt%/receipt.txt}"
          receipt_id="${receipt_dir##*/}"
          receipt_field() {
            awk -F= -v key="$1" '$1 == key { count++; value=substr($0, index($0, "=") + 1) } END { if (count != 1) exit 1; print value }' "$receipt"
          }
          if [[ "$(receipt_field IDENTIFIER)" != "$receipt_id" ]] \
            || [[ "$(receipt_field RECEIPT_PATH)" != "$receipt" ]]; then
            echo "::error::El recibo no identifica univocamente esta invocacion."
            exit 1
          fi

          receipt_artifact="$job_artifacts/containment-receipt"
          mkdir -m 700 "$receipt_artifact"
          cp -- "$receipt" "$receipt_artifact/receipt.txt"
          for evidence in accreditation.status accreditation.reason accreditation.details \
            scenario.rc product-cleanup.result product-cleanup.observed defensive-cleanup.status; do
            if [[ -f "$receipt_dir/$evidence" && ! -L "$receipt_dir/$evidence" ]]; then
              cp -- "$receipt_dir/$evidence" "$receipt_artifact/$evidence"
            fi
          done

          for field_value in \
            "ACCREDITATION=PASS" \
            "RECEIPT_COMPLETENESS=COMPLETE" \
            "CLOSURE=CONFIRMED" \
            "LAUNCHER_WAIT_COMPLETED=YES" \
            "CONTAINMENT_EVIDENCE_CERTIFIABLE=YES" \
            "DEFENSIVE_CLEANUP=PASS"; do
            if ! grep -Fqx "$field_value" "$receipt"; then
              echo "::error::El recibo no certifica la frontera/cierre: falta $field_value."
              exit 1
            fi
          done

          scenario_rc="$(receipt_field SCENARIO_RC)"
          positive_acceptance="$(receipt_field POSITIVE_ACCEPTANCE)"
          product_cleanup="$(receipt_field PRODUCT_CLEANUP_RESULT)"
          product_cleanup_observed="$(receipt_field PRODUCT_CLEANUP_OBSERVED_BEFORE_DEFENSIVE_CLEANUP)"
          if [[ "$(receipt_field WRAPPER_EXIT_CODE)" != "$entry_rc" ]]; then
            echo "::error::El RC de la entrada no coincide con el RC registrado en el recibo."
            exit 1
          fi
          if [[ "$entry_rc" == 0 && "$scenario_rc" == 0 && "$positive_acceptance" == YES \
            && "$product_cleanup" == PASS && "$product_cleanup_observed" == YES ]]; then
            echo "V2 safety bank completed with positive acceptance; receipt=$receipt"
            exit 0
          fi
          if [[ "$entry_rc" == 70 && "$scenario_rc" == 0 && "$positive_acceptance" == NO ]]; then
            if [[ "$product_cleanup" == FAIL ]]; then
              echo "::error::El banco V2 completo declaro FAIL en la limpieza del producto; recibo=$receipt"
              exit 1
            fi
            echo "::error::El escenario V2 devolvio RC 0, pero la entrada no pudo certificar aceptación positiva (limpieza=$product_cleanup); no es un fallo de contrato del banco."
            exit 1
          fi
          if [[ "$scenario_rc" =~ ^[0-9]+$ && "$scenario_rc" != 0 ]]; then
            echo "::error::El banco V2 fallo con RC $scenario_rc (RC de la entrada: $entry_rc); recibo=$receipt"
            exit 1
          fi
          echo "::error::El recibo/RC de la ejecución V2 no permite certificar ni clasificar el resultado; RC entrada=$entry_rc, RC escenario=$scenario_rc."
          exit 1

      - name: Upload V2 safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-safety-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v2-safety-job-artifacts/
            !${{ runner.temp }}/v2-safety-job-artifacts/**/work/**
            !${{ runner.temp }}/v2-safety-job-artifacts/**/*.db
            !${{ runner.temp }}/v2-safety-job-artifacts/**/*.sqlite
            !${{ runner.temp }}/v2-safety-job-artifacts/**/*.sqlite3
          if-no-files-found: warn
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [test, v2-safety]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-tag release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: bash tools/release/auto-tag.sh
